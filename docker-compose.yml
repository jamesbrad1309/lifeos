# Request path:  browser → gateway → bff → api → postgres
#                                  ↘ frontend (static SPA)
#
# Only `gateway` (and postgres, for local tooling like Prisma Studio) is
# published to the host for browsers. `api` is reachable only on the internal
# Compose network. `bff` is also published on 127.0.0.1:4000 (loopback only)
# so `./start.sh` can run the backend here and Vite's dev server (:5173) on
# the host, whose proxy sends /graphql to localhost:4000.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lifeos
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: lifeos
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgres://lifeos:lifeos@postgres:5432/lifeos
      API_PORT: "3000"
      NODE_ENV: production
    expose: ["3000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # node:22-slim has no curl, so the check uses Node's built-in fetch.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  bff:
    build:
      context: .
      dockerfile: docker/bff.Dockerfile
    environment:
      BFF_PORT: "4000"
      API_URL: http://api:3000
      NODE_ENV: production
    expose: ["4000"]
    # Loopback only: for Vite's dev proxy (./start.sh), not for other machines.
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    expose: ["80"]

  gateway:
    image: nginx:1.31-alpine
    volumes:
      - ./docker/gateway.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:80"]
    depends_on:
      bff:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  pgdata:
