name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # postinstall runs `prisma generate` for apps/api.
      - run: pnpm install --frozen-lockfile

      # Unlike `pnpm check`, `biome ci` fails on unformatted code instead of fixing it.
      - name: Format & lint
        run: |
          pnpm exec biome ci .
          pnpm exec oxlint .

      - run: pnpm build
      - run: pnpm test

  migrations:
    name: Prisma migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lifeos
          POSTGRES_USER: lifeos
          POSTGRES_PASSWORD: lifeos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lifeos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://lifeos:lifeos@localhost:5432/lifeos
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter api...

      - name: Apply migrations to a fresh database
        run: pnpm exec prisma migrate deploy

      # Exit code 2 means schema.prisma has changes with no migration for them.
      - name: Check schema.prisma matches the migrations
        run: >
          pnpm exec prisma migrate diff
          --from-schema-datasource prisma/schema.prisma
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

  docker:
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [api, bff, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
