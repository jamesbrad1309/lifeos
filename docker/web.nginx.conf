# Static file server for the built SPA only. Routing to the BFF is the
# gateway's job (docker/gateway.nginx.conf), so this container knows nothing
# about /graphql.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Vite's hashed build assets never change for a given name, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else falls back to index.html (client-side routes). index.html
    # itself must not be cached, or users keep loading old asset hashes.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
