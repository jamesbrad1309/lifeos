# Client gateway: the only container published to the host. Browsers talk to
# this and nothing else:
#
#   /graphql  → bff:4000  (GraphQL BFF, which calls api:3000 over REST)
#   /*        → web:80    (static SPA)
#
# The api and postgres containers are reachable only on the internal Compose
# network. See docs/infra/docker.md.

# A request id minted here (nginx's $request_id) or passed through from the
# client, forwarded to the BFF, then forwarded again to the API. All three
# services log the same id for one user action.
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

log_format gateway escape=json
    '{"time":"$time_iso8601","service":"gateway","reqId":"$req_id",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes":$body_bytes_sent,"durationMs":$request_time,'
    '"upstream":"$upstream_addr","upstreamMs":"$upstream_response_time"}';

# Basic abuse protection for the API surface: 20 req/s per client IP, with bursts.
limit_req_zone $binary_remote_addr zone=graphql:10m rate=20r/s;

upstream bff {
    server bff:4000;
    keepalive 16;
}

upstream web {
    server web:80;
}

server {
    listen 80;
    access_log /dev/stdout gateway;

    client_max_body_size 1m;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Request-Id $req_id always;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location /graphql {
        limit_req zone=graphql burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://bff;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $req_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The BFF echoes x-request-id too; hide it so the response has exactly one (added above).
        proxy_hide_header X-Request-Id;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $req_id;
    }
}
